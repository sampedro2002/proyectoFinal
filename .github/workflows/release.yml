name: 📦 Crear Release con APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag para el release (ej: v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Crear Release
    runs-on: ubuntu-latest

    steps:
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: "Release ${{ inputs.tag_name }}"
          body: |
            ## 📱 App Móvil Android
            Descarga el archivo **Instalar.apk** e instálalo en tu dispositivo Android.

            ---
            _Release generado desde GitHub Actions_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
