name: 📦 Crear Release con APK y Setup

# Se dispara manualmente desde la pestaña Actions de GitHub
# Esto permite subir los binarios como assets sin necesidad de tenerlos en el repo
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag para el release (ej: v1.1.0)'
        required: true
        type: string
      release_notes:
        description: 'Notas del release (opcional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Crear Release
    runs-on: ubuntu-latest

    steps:
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: "Release ${{ inputs.tag_name }}"
          body: |
            ## 📱 App Móvil Android
            Descarga el archivo **Instalar.apk** e instálalo en tu dispositivo Android.

            ## 🖥️ Instalador Windows
            Descarga **setup.exe** y ejecútalo para instalar la aplicación en Windows.

            ${{ inputs.release_notes }}

            ---
            _Release generado desde GitHub Actions_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
